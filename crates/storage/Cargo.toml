[package]
name = "weave-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Without this feature, the system SQLite library (3.14.0 or newer) is linked.
# Libraries leave the choice to the final binary; see apps/cli.
sqlite-from-source = ["rusqlite/bundled"]

[dependencies]
weave-core.workspace = true
rusqlite = "0.37"
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
