[package]
name = "weave-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weave-player"
path = "src/main.rs"

[features]
default = ["audio", "mpris"]
# Audio output (rodio). Needs the ALSA development files on Linux; build with
# --no-default-features for a binary that cannot play sound.
audio = ["weave/audio"]
# Desktop media controls over D-Bus (MPRIS): media keys, GNOME/KDE widgets, playerctl.
mpris = ["weave/mpris"]
# By default the system SQLite (3.14.0 or newer) is linked. Enable this to compile
# SQLite from source and link it statically instead (needs a C compiler).
sqlite-from-source = ["weave/sqlite-from-source"]

# The CLI is a frontend over the `weave` library and nothing else.
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
weave.workspace = true
