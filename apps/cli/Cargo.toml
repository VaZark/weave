[package]
name = "weave-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weave-player"
path = "src/main.rs"

[features]
# By default the system SQLite (3.14.0 or newer) is linked. Enable this to compile
# SQLite from source and link it statically instead (needs a C compiler).
sqlite-from-source = ["weave-engine/sqlite-from-source"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
weave-core.workspace = true
weave-engine.workspace = true
