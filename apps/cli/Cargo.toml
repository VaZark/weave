[package]
name = "weave-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weave-player"
path = "src/main.rs"

[features]
# Compile SQLite from source and link it statically (needs a C compiler). Build with
# --no-default-features to link the system SQLite instead.
default = ["sqlite-from-source"]
sqlite-from-source = ["weave-engine/sqlite-from-source"]

[dependencies]
weave-core.workspace = true
weave-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
