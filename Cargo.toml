[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/gui",
  "crates/local",
  "crates/icons",
  "crates/core",
  "crates/engine",
  "crates/storage",
  "crates/weave",
  "vendor/weaver",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
weaver = { path = "vendor/weaver" }
weave-player-core = { path = "crates/core" }
weave-player-lib = { path = "crates/weave" }
weave-player-engine = { path = "crates/engine" }
weave-player-local = { path = "crates/local" }
weave-player-storage = { path = "crates/storage" }

weave-icons = { path = "crates/icons" }
iced-adaptive-design = { git = "https://github.com/VaZark/iced-libadwaita", rev = "c61ccbe55b6655d95537c22bcaddd938f5125c4a" }
