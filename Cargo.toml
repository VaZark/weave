[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/engine",
    "backends/local",
    "apps/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
weave-core = { path = "crates/core" }
weave-storage = { path = "crates/storage" }
weave-engine = { path = "crates/engine" }
weave-local = { path = "backends/local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
