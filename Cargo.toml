[workspace]
resolver = "2"
members = [
  "apps/cli",
  "crates/local",
  "crates/core",
  "crates/engine",
  "crates/storage",
  "crates/weave",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
weave-core = { path = "crates/core" }
weave = { path = "crates/weave" }
weave-engine = { path = "crates/engine" }
weave-local = { path = "crates/local" }
weave-storage = { path = "crates/storage" }
