name: Release

# Manual only. The version comes from [workspace.package] in Cargo.toml: bump it, merge, then run this.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "weave-player") | .version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Refuse to release a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # SQLite is compiled in so the binary does not depend on the runner's system SQLite.
      - name: Build release binary
        run: cargo build --release --locked -p weave-player --features sqlite-from-source

      - name: Package
        run: |
          name="weave-player-$VERSION-linux-x86_64"
          mkdir "$name"
          cp target/release/weave-player LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes $flags
